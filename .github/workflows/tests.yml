name: Tests

# Every pull request and every push to main runs both suites. The backend and
# the frontend keep copies of the same rules (the sheet parser, the live
# documents' event diff) checked against shared fixtures, and only running
# both keeps them from drifting apart.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"   # the image's (backend/Dockerfile)
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "20"       # the image's (frontend/Dockerfile)
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install -g npm@11.11.0 && npm ci
      - run: npx vitest run
      - run: npm run build
