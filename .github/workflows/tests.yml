name: Tests

# Every pull request runs both suites, and the image build calls this workflow
# again on a release, so no image is pushed from a red commit. The backend and
# the frontend keep copies of the same rules (the sheet parser, the live
# documents' event diff) checked against shared fixtures, and only running
# both keeps them from drifting apart.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"   # the image's (backend/Dockerfile)
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "26"       # the image's (frontend/Dockerfile)
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The npm the lockfile was written with, pinned (see frontend/Dockerfile).
      - run: npm install -g npm@11.11.0 && npm ci  # zizmor: ignore[adhoc-packages]
      - run: npx vitest run
      - run: npm run build
