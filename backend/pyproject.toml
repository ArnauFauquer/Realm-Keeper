[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "venv",
    ".pytest_cache"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["."]

# uvicorn runs the app (the Dockerfile's CMD); python-dotenv, websockets,
# python-multipart, httpx and certifi are loaded by name by uvicorn[standard],
# FastAPI's forms and the S3 client; anyio and idna are floors that keep their
# CVEs out. None is imported by the code.
[tool.deptry.per_rule_ignores]
DEP002 = ["uvicorn", "python-dotenv", "websockets", "python-multipart", "httpx", "certifi", "anyio", "idna"]
