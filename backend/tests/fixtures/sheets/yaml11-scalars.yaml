# How YAML 1.1 (PyYAML, the backend's reader) types each plain scalar, seen
# through an item's text, which is Python's str() of it.
name: Scalars
sections:
  - title: Each item is one scalar
    items:
      - yes
      - Off
      - y
      - 1.0
      - 6.
      - 010
      - 0x1F
      - 0b101
      - 1_000
      - 1e3
      - 1.0e3
      - 1.0e+3
      - 12345678901234567.0
      - 0.00001
      - -.inf
      - .NaN
      - 1:30
      - 1:30.5
      - 2024-01-01
      - 2024-01-01 10:20:30.5 +02:00
      - ~
      - 'yes'
      - [a, "b'c", 1.5, null, true]
      - {a: 1, 2: [x], yes: no}
