{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "realm-keeper.fullname" . }}
  labels:
    {{- include "realm-keeper.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.host | quote }}
      http:
        paths:
          {{- range list "/api" "/ws" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "realm-keeper.fullname" $ }}-backend
                port:
                  number: {{ $.Values.backend.port }}
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "realm-keeper.fullname" . }}-frontend
                port:
                  number: {{ .Values.service.frontendPort }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
{{- end }}
