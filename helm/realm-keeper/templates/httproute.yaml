{{- if .Values.httpRoute.enabled }}
{{- if not .Values.httpRoute.parentRefs }}{{ fail "httpRoute.parentRefs is required when httpRoute.enabled" }}{{ end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "realm-keeper.fullname" . }}
  labels:
    {{- include "realm-keeper.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    - {{ .Values.host | quote }}
  rules:
    - matches:
        {{- range list "/api" "/ws" }}
        - path:
            type: PathPrefix
            value: {{ . }}
        {{- end }}
      backendRefs:
        - name: {{ include "realm-keeper.fullname" . }}-backend
          port: {{ .Values.backend.port }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "realm-keeper.fullname" . }}-frontend
          port: {{ .Values.service.frontendPort }}
{{- end }}
