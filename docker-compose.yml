# kics-scan disable=8c978947-0ff6-485c-b0c2-0bfca6026466
# Everything is optional except the app itself:
#
#   docker compose up --build
#     The notes are the folder VAULT_DIR (an Obsidian vault, say), read and
#     written as plain files; documents, images and audio go to a volume.
#
#   Notes in git: set REPO_URL (and GIT_ENABLED, on by default with it).
#   Files in S3:  set COMPOSE_PROFILES=s3 and STORAGE_BACKEND=s3 to also run
#                 MinIO here, or point S3_ENDPOINT_URL at a bucket you have.
#   Login:        ENABLE_AUTH=false runs it open; otherwise configure a
#                 provider (OIDC_*, GITHUB_*, GOOGLE_*), see .env.example.
services:
  minio:
    profiles: ["s3"]
    image: quay.io/minio/minio:latest
    container_name: realm-keeper-minio
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      # Development defaults for a MinIO that listens on 127.0.0.1 only.
      # kics-scan ignore-line
      - MINIO_ROOT_USER=${S3_ACCESS_KEY:-minioadmin}
      # kics-scan ignore-line
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY:-minioadmin123}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    profiles: ["s3"]
    image: quay.io/minio/mc:latest
    container_name: realm-keeper-minio-init
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Runs once and exits: nothing to check.
    healthcheck:
      # kics-scan ignore-line
      disable: true
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      # kics-scan ignore-line
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin123}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY &&
      mc mb -p local/${S3_BUCKET_NAME:-realm-keeper-audio} &&
      exit 0
      "

  backend:
    build: ./backend
    container_name: realm-keeper-backend
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      # This machine only, like MinIO: from elsewhere the app is reached
      # through the frontend's nginx. The backend trusts X-Forwarded-*
      # headers (--forwarded-allow-ips), which anyone reaching it directly
      # could forge.
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - VAULT_PATH=/vault
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - STORAGE_LOCAL_PATH=/data
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-http://minio:9000}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      # kics-scan ignore-line
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin123}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-realm-keeper-audio}
      - S3_REGION=${S3_REGION:-us-east-1}
    volumes:
      # A host folder (your Obsidian vault: VAULT_DIR=/path/to/vault), or a
      # named volume holding the git clone when VAULT_DIR is unset. The
      # container runs as UID 10001, which must be able to write it.
      - ${VAULT_DIR:-vault}:/vault
      # Documents, images and audio when STORAGE_BACKEND=local.
      - ${DATA_DIR:-data}:/data
    depends_on:
      minio-init:
        condition: service_completed_successfully
        # Only there with the s3 profile.
        required: false
  frontend:
    build:
      context: ./frontend
      args:
        # Empty on purpose: nginx.conf proxies /api and /ws to the backend
        # container, so they appear same-origin to the browser (required
        # for the login cookie — see nginx.conf).
        - VITE_API_URL=${VITE_API_URL:-}
    container_name: realm-keeper-frontend
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
    # The only service meant to be reached from other machines (the LAN,
    # a reverse proxy): hence every interface.
    # kics-scan ignore-line
    ports:
      - "5173:8080"
    depends_on:
      - backend

# Each named volume belongs to one service; kics-scan counts any volume as shared.
volumes:
  minio-data:
  vault:
  data:
