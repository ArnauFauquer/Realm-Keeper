services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: realm-keeper-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY:-minioadmin123}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: realm-keeper-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin123} &&
      mc mb -p local/${S3_BUCKET_NAME:-realm-keeper-audio} &&
      exit 0
      "

  backend:
    build: ./backend
    container_name: realm-keeper-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-http://minio:9000}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin123}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-realm-keeper-audio}
      - S3_REGION=${S3_REGION:-us-east-1}
    depends_on:
      minio-init:
        condition: service_completed_successfully
  frontend:
    build:
      context: ./frontend
      args:
        # Empty on purpose: nginx.conf proxies /api, /vault-assets and /ws to
        # the backend container, so they appear same-origin to the browser
        # (required for the login cookie — see nginx.conf).
        - VITE_API_URL=${VITE_API_URL:-}
    container_name: realm-keeper-frontend
    restart: unless-stopped
    ports:
      - "5173:8080"
    depends_on:
      - backend

volumes:
  minio-data:
