services:
  backend:
    build: ./backend
    container_name: realm-keeper-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/vault:/app/vault
    environment:
      - PYTHONUNBUFFERED=1
      - REPO_URL=${REPO_URL:-}
      - NOTE_TAG_IGNORE=${NOTE_TAG_IGNORE:-draft}
      - VAULT_SYNC_INTERVAL=${VAULT_SYNC_INTERVAL:-180}
  frontend:
    build: ./frontend
    container_name: realm-keeper-frontend
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
