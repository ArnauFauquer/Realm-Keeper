services:
  backend:
    build: ./backend
    container_name: realm-keeper-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
  frontend:
    build: 
      context: ./frontend
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    container_name: realm-keeper-frontend
    ports:
      - "5173:8080"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    depends_on:
      - backend
