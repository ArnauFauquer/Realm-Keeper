# kics-scan disable=e84eaf4d-2f45-47b2-abe8-e581b06deb66
# (ArgoCD creates the namespace: CreateNamespace=true, see home_lab realmkeeper.yaml)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: realm-keeper-backend
  namespace: realmkeeper
  annotations:
    checkov.io/skip1: CKV_K8S_43=Tagged by release-please; a digest would go stale on each release
  labels:
    app: realm-keeper-backend
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: realm-keeper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: realm-keeper-backend
  # One pod at a time, never two: the live documents (encounters, maps,
  # characters) and what the screens show are held in the process's memory.
  # With a rolling update both pods sat behind the Service for a while — a
  # GM's "send to screen" could reach one pod while the TVs listened to the
  # other, and edits made on the new pod were reset by the old one's final
  # save. Recreate stops the old pod first (it saves what it holds on the
  # way out), then starts the new one, which loads that. The price is the
  # new pod's clone time without a backend; HA is not a goal (see
  # ARCHITECTURE.md, Deployment constraints).
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: realm-keeper-backend
        app.kubernetes.io/name: realm-keeper-backend
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: realm-keeper
      annotations:
        container.apparmor.security.beta.kubernetes.io/realm-keeper-backend: runtime/default
    spec:
      # The app never calls the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: realm-keeper-backend
          # Pinned by release tag, not digest: release-please bumps the tag on
          # each release and a digest would go stale (CKV_K8S_43).
          # kics-scan ignore-line
          image: ghcr.io/arnaufauquer/realm-keeper/backend:0.4.4 # x-release-please-version
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          # Sized from the running pod's cgroup counters (no metrics-server in
          # the cluster): memory.peak 97Mi over its first ~10h, including the
          # startup vault clone; CPU averaged ~1m (33.5s of CPU in 10.4h),
          # never throttled. The memory limit leaves room for one S3 upload on
          # top of that peak — boto3's upload_fileobj buffers up to 10
          # concurrent 8MB parts (~80Mi) — with ~2x headroom. The CPU limit
          # is one core: the app is a single Python process, so the GIL keeps
          # its own work there anyway; the limit only caps git subprocesses.
          # Re-check memory.peak / cpu.stat nr_throttled after changes that
          # add load.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 384Mi
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          env:
            - name: REPO_URL_FILE
              value: /secrets/REPO_URL
            - name: NOTE_TAG_IGNORE
              value: "draft"
            - name: CORS_ALLOWED_ORIGINS
              value: "https://realmkeeper.faukinator.com"
            - name: VAULT_PATH
              value: "/vault"
            - name: GIT_SYNC_INTERVAL
              value: "300"
            - name: GOOGLE_CLIENT_ID_FILE
              value: /secrets/GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET_FILE
              value: /secrets/GOOGLE_CLIENT_SECRET
            - name: SESSION_SECRET_KEY_FILE
              value: /secrets/SESSION_SECRET_KEY
            - name: ALLOWED_EMAILS_FILE
              value: /secrets/ALLOWED_EMAILS
            - name: FRONTEND_URL
              value: "https://realmkeeper.faukinator.com"
            - name: SESSION_COOKIE_SECURE
              value: "true"
            # Provisioned by ceph-object-bucket-claim.yaml (Rook-Ceph RGW)
            - name: S3_ENDPOINT_URL
              value: "http://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc:80"
            - name: S3_REGION
              value: "us-east-1"
            - name: S3_BUCKET_NAME
              valueFrom:
                configMapKeyRef:
                  name: realm-keeper-audio
                  key: BUCKET_NAME
            - name: S3_ACCESS_KEY_FILE
              value: /secrets/S3_ACCESS_KEY
            - name: S3_SECRET_KEY_FILE
              value: /secrets/S3_SECRET_KEY
          volumeMounts:
            # Written by the app.
            # kics-scan ignore-line
            - name: vault-data
              mountPath: /vault
            # Everything else the app writes, with the root filesystem
            # read-only: the vault clone staging dir and spooled uploads
            # (/tmp), LOG_DIR (/app/logs) and git's --global safe.directory
            # entry (~/.gitconfig).
            # Written by the app.
            # kics-scan ignore-line
            - name: tmp
              mountPath: /tmp
            # Written by the app.
            # kics-scan ignore-line
            - name: logs
              mountPath: /app/logs
            # Written by the app.
            # kics-scan ignore-line
            - name: home
              mountPath: /home/appuser
            # The Secrets as files (see load_secret_files in config/settings.py).
            - name: secrets
              mountPath: /secrets
              readOnly: true
          # Uvicorn only starts answering once the startup vault clone is done
          # (see main.py lifespan), which sync_vault allows up to 300s. This
          # gives it 320s before the kubelet gives up, and keeps the liveness
          # probe from killing a pod that's still cloning.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 64
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: vault-data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: home
          emptyDir: {}
        - name: secrets
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: realm-keeper-secrets
                  items:
                    - {key: REPO_URL, path: REPO_URL}
                    - {key: GOOGLE_CLIENT_ID, path: GOOGLE_CLIENT_ID}
                    - {key: GOOGLE_CLIENT_SECRET, path: GOOGLE_CLIENT_SECRET}
                    - {key: SESSION_SECRET_KEY, path: SESSION_SECRET_KEY}
                    - {key: ALLOWED_EMAILS, path: ALLOWED_EMAILS}
              - secret:
                  name: realm-keeper-audio
                  items:
                    - {key: AWS_ACCESS_KEY_ID, path: S3_ACCESS_KEY}
                    - {key: AWS_SECRET_ACCESS_KEY, path: S3_SECRET_KEY}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: realm-keeper-backend
                topologyKey: kubernetes.io/hostname
