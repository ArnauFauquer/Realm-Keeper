apiVersion: apps/v1
kind: Deployment
metadata:
  name: realm-keeper-backend
  labels:
    app: realm-keeper-backend
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: realm-keeper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: realm-keeper-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: realm-keeper-backend
        app.kubernetes.io/name: realm-keeper-backend
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: realm-keeper
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: realm-keeper-backend
          image: ghcr.io/arnaufauquer/realm-keeper/backend:0.1.44
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          env:
            - name: REPO_URL
              valueFrom:
                secretKeyRef:
                  name: realm-keeper-secrets
                  key: REPO_URL
            - name: NOTE_TAG_IGNORE
              value: "draft"
            - name: CORS_ALLOWED_ORIGINS
              value: "https://realmkeeper.faukinator.com"
            - name: VAULT_PATH
              value: "/vault"
            - name: GIT_SYNC_INTERVAL
              value: "300"
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: realm-keeper-secrets
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: realm-keeper-secrets
                  key: GOOGLE_CLIENT_SECRET
            - name: SESSION_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: realm-keeper-secrets
                  key: SESSION_SECRET_KEY
            - name: ALLOWED_EMAILS
              valueFrom:
                secretKeyRef:
                  name: realm-keeper-secrets
                  key: ALLOWED_EMAILS
            - name: FRONTEND_URL
              value: "https://realmkeeper.faukinator.com"
            - name: SESSION_COOKIE_SECURE
              value: "true"
            # Provisioned by ceph-object-bucket-claim.yaml (Rook-Ceph RGW)
            - name: S3_ENDPOINT_URL
              value: "http://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc:80"
            - name: S3_REGION
              value: "us-east-1"
            - name: S3_BUCKET_NAME
              valueFrom:
                configMapKeyRef:
                  name: realm-keeper-audio
                  key: BUCKET_NAME
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: realm-keeper-audio
                  key: AWS_ACCESS_KEY_ID
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: realm-keeper-audio
                  key: AWS_SECRET_ACCESS_KEY
          volumeMounts:
            - name: vault-data
              mountPath: /vault 
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: vault-data
          persistentVolumeClaim:
            claimName: realm-keeper-vault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: realm-keeper-backend
                topologyKey: kubernetes.io/hostname
