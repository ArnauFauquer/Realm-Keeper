apiVersion: apps/v1
kind: Deployment
metadata:
  name: realm-keeper-backend
  labels:
    app: realm-keeper-backend
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: realm-keeper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: realm-keeper-backend
  # The vault is a per-pod emptyDir clone of REPO_URL (every write is
  # committed and pushed right away, so the git remote is the source of
  # truth), which leaves nothing for two pods to fight over: the new pod
  # clones and turns ready before the old one is stopped. While both run,
  # concurrent pushes are reconciled by commit_and_push's pull --rebase retry.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: realm-keeper-backend
        app.kubernetes.io/name: realm-keeper-backend
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: realm-keeper
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: realm-keeper-backend
          image: ghcr.io/arnaufauquer/realm-keeper/backend:0.1.74 # x-release-please-version
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          # Sized from the running pod's cgroup counters (no metrics-server in
          # the cluster): memory.peak 97Mi over its first ~10h, including the
          # startup vault clone; CPU averaged ~1m (33.5s of CPU in 10.4h),
          # never throttled. The memory limit leaves room for one S3 upload on
          # top of that peak — boto3's upload_fileobj buffers up to 10
          # concurrent 8MB parts (~80Mi) — with ~2x headroom. The CPU limit
          # is one core: the app is a single Python process, so the GIL keeps
          # its own work there anyway; the limit only caps git subprocesses.
          # Re-check memory.peak / cpu.stat nr_throttled after changes that
          # add load.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 384Mi
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          env:
            - name: REPO_URL
              valueFrom:
                secretKeyRef:
                  name: realm-keeper-secrets
                  key: REPO_URL
            - name: NOTE_TAG_IGNORE
              value: "draft"
            - name: CORS_ALLOWED_ORIGINS
              value: "https://realmkeeper.faukinator.com"
            - name: VAULT_PATH
              value: "/vault"
            - name: GIT_SYNC_INTERVAL
              value: "300"
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: realm-keeper-secrets
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: realm-keeper-secrets
                  key: GOOGLE_CLIENT_SECRET
            - name: SESSION_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: realm-keeper-secrets
                  key: SESSION_SECRET_KEY
            - name: ALLOWED_EMAILS
              valueFrom:
                secretKeyRef:
                  name: realm-keeper-secrets
                  key: ALLOWED_EMAILS
            - name: FRONTEND_URL
              value: "https://realmkeeper.faukinator.com"
            - name: SESSION_COOKIE_SECURE
              value: "true"
            # Provisioned by ceph-object-bucket-claim.yaml (Rook-Ceph RGW)
            - name: S3_ENDPOINT_URL
              value: "http://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc:80"
            - name: S3_REGION
              value: "us-east-1"
            - name: S3_BUCKET_NAME
              valueFrom:
                configMapKeyRef:
                  name: realm-keeper-audio
                  key: BUCKET_NAME
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: realm-keeper-audio
                  key: AWS_ACCESS_KEY_ID
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: realm-keeper-audio
                  key: AWS_SECRET_ACCESS_KEY
          volumeMounts:
            - name: vault-data
              mountPath: /vault
            # Everything else the app writes, with the root filesystem
            # read-only: the vault clone staging dir and spooled uploads
            # (/tmp), LOG_DIR (/app/logs) and git's --global safe.directory
            # entry (~/.gitconfig).
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /app/logs
            - name: home
              mountPath: /home/appuser
          # Uvicorn only starts answering once the startup vault clone is done
          # (see main.py lifespan), which sync_vault allows up to 300s. This
          # gives it 320s before the kubelet gives up, and keeps the liveness
          # probe from killing a pod that's still cloning.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 64
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: vault-data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: home
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: realm-keeper-backend
                topologyKey: kubernetes.io/hostname
