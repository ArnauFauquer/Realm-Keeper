# kics-scan disable=e84eaf4d-2f45-47b2-abe8-e581b06deb66
# (ArgoCD creates the namespace: CreateNamespace=true, see home_lab realmkeeper.yaml)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: realm-keeper-frontend
  namespace: realmkeeper
  annotations:
    checkov.io/skip1: CKV_K8S_43=Tagged by release-please; a digest would go stale on each release
  labels:
    app: realm-keeper-frontend
    app.kubernetes.io/name: realm-keeper-frontend
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: realm-keeper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: realm-keeper-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: realm-keeper-frontend
        app.kubernetes.io/name: realm-keeper-frontend
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: realm-keeper
      annotations:
        container.apparmor.security.beta.kubernetes.io/frontend: runtime/default
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10101
        runAsGroup: 10101
        fsGroup: 10101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          # Pinned by release tag, not digest: release-please bumps the tag on
          # each release and a digest would go stale (CKV_K8S_43).
          # kics-scan ignore-line
          image: ghcr.io/arnaufauquer/realm-keeper/frontend:0.4.4 # x-release-please-version
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: 10101
            runAsGroup: 10101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          # Sized from the running pod's cgroup counters (no metrics-server in
          # the cluster): memory.peak 20Mi over its first ~10h, CPU ~0.06m on
          # average, never throttled. It only serves the static bundle —
          # uploads go straight to the backend via the ingress — so a 3x
          # memory margin is plenty; the CPU limit caps a runaway worker.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 64Mi
          # nginx-unprivileged writes its pid and temp files to /tmp, and the
          # entrypoint renders nginx.conf.template into /etc/nginx/conf.d at
          # startup — both need to stay writable with a read-only root.
          volumeMounts:
            # Written by the app.
            # kics-scan ignore-line
            - name: tmp
              mountPath: /tmp
            # Written by the app.
            # kics-scan ignore-line
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-conf
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: realm-keeper-frontend
                topologyKey: kubernetes.io/hostname
